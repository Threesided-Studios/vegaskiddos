name: Tests

# Unit tests (lib + tools, incl. the fb-post event filter) on every PR and on
# pushes to main, so picker/date regressions are caught before they post.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
