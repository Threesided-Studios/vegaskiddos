name: Deploy (Cloudflare Workers)

# TEMPORARY preview-only dispatch for PR #54. Do not merge this file.
# Production traffic is not changed. Versions upload + preview alias only.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: preview-security-next
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Pin api.cloudflare.com to IPv4
        run: |
          IP=$(getent ahostsv4 api.cloudflare.com | awk '{print $1; exit}')
          echo "$IP api.cloudflare.com" | sudo tee -a /etc/hosts
          echo "pinned api.cloudflare.com -> $IP"
      - name: Build + upload preview version (no production traffic)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          npm run cf:build
          npx wrangler versions upload --keep-vars --preview-alias security-next --tag security-next --message "PR 54 Next.js 16.4.6 security preview. Do not deploy to production."
